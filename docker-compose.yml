services:
  postgres:
    image: postgres:16-alpine
    container_name: syborx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${DB_NAME:-syborx_messenger_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-syborx_messenger_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - syborx_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: syborx_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@syborx.com
      PGADMIN_DEFAULT_PASSWORD: admin_password_123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - syborx_network

volumes:
  postgres_data:
    driver: local

networks:
  syborx_network:
    driver: bridge
