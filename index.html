<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyBorx Comunity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">

  <div id="app" class="app">

    <!-- ===== Sidebar 30% ===== -->
    <aside class="sidebar">
      <div class="sidebar-inner">

        <!-- Información del usuario + cambio de tema -->
        <div class="profile-card glass">
          <button id="profile-open" class="profile-main" title="Cambiar de perfil (demo)">
            <span id="me-avatar" class="avatar">JR</span>
            <span class="profile-main__info">
              <strong id="me-name">Jorge Ramírez</strong>
              <span id="me-role">Gerente General</span>
            </span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <button id="theme-toggle" class="icon-btn" title="Cambiar tema claro / oscuro">
            <svg id="ico-moon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg id="ico-sun" class="hidden" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>

          <!-- Menú de perfiles (demo de roles) -->
          <div id="profile-menu" class="menu glass hidden">
            <div class="menu-title">Ver como (demo de roles)</div>
            <div id="profile-menu-list"></div>
          </div>
        </div>

        <!-- Switch Comunidad / Grupos -->
        <div id="view-switch" class="seg">
          <span class="seg-pill"></span>
          <button class="seg-btn active" data-view="direct">Comunidad</button>
          <button class="seg-btn" data-view="groups">Grupos</button>
        </div>

        <!-- Lista de chats -->
        <div class="list-head">
          <span id="list-title">Comunidad</span>
          <button id="new-group-btn" class="icon-btn hidden" title="Crear grupo">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <div id="chat-list" class="chat-list"></div>

      </div>
    </aside>

    <!-- ===== Área principal 70% ===== -->
    <main class="main">

      <header id="chat-header" class="chat-header glass hidden">
        <div class="chat-header__info">
          <span id="chat-avatar" class="avatar">..</span>
          <div class="chat-header__text">
            <strong id="chat-name">Nombre</strong>
            <span id="chat-sub">subtítulo</span>
          </div>
        </div>
        <button id="members-btn" class="icon-btn hidden" title="Ver integrantes y roles">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </button>
      </header>

      <div id="empty-state" class="empty-state">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </div>
        <h1>SyBorx Comunity</h1>
        <p>La comunicación interna de tu equipo, con liquid glass.</p>
      </div>

      <div id="messages" class="messages hidden">
        <div id="messages-inner" class="messages-inner"></div>
      </div>

      <div id="composer" class="composer-wrap hidden">
        <div id="attachments-preview" class="attachments-preview"></div>
        <div class="composer glass">
          <button id="attach-btn" class="attach-btn" title="Adjuntar imágenes o documentos">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <textarea id="input" rows="1" placeholder="Escribe un mensaje..."></textarea>
          <button id="send-btn" class="send-btn" title="Enviar">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>

      <input type="file" id="file-input" class="hidden" multiple
        accept="image/*,.pdf,.doc,.docx,.txt,.xls,.xlsx,.csv,.zip,.md">

    </main>
  </div>

  <!-- ===== Modal (integrantes / roles / crear grupo) ===== -->
  <div id="modal" class="modal hidden">
    <div class="modal-card glass">
      <div class="modal-head">
        <h3 id="modal-title">Título</h3>
        <button id="modal-close" class="icon-btn" title="Cerrar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- Socket.io & Backend Integration Client -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
